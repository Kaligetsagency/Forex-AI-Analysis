<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex AI Analysis</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Volatility 75 AI Analysis</h1>
            <button id="subscribeBtn" class="btn">Subscribe via Snippe (50k TZS)</button>
        </header>

        <div class="chart-wrapper">
            <div id="chartContainer" class="live-chart-container"></div>
        </div>

        <div class="analysis-panel">
            <button id="analyzeBtn" class="btn btn-primary">Run Gemini AI Analysis</button>
            <div id="aiResult" class="result-box">Waiting for input...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
